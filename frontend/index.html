<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia · Gestão</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; color: #222; }
    nav button { padding: 8px 14px; margin-right: 6px; cursor: pointer; }
    nav button.ativo { background: #222; color: #fff; }
    section { display: none; margin-top: 16px; }
    section.ativo { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: flex; flex-direction: column; font-size: 13px; }
    input, select { padding: 6px; }
    #msg { margin: 12px 0; padding: 8px; display: none; border-radius: 4px; }
    #msg.erro { display: block; background: #fde2e2; }
    #msg.ok { display: block; background: #e0f5e4; }
  </style>
</head>
<body>
  <h1>Sistema de Gestão de Academia</h1>
  <nav>
    <button data-tab="planos" class="ativo">Planos</button>
    <button data-tab="alunos">Alunos</button>
    <button data-tab="aulas">Aulas</button>
  <button data-tab="arquivos">Arquivos</button>
  <button data-tab="relatorios">Relat&oacute;rios</button>
  </nav>
  <div id="msg"></div>

  <section id="planos" class="ativo">
    <form id="f-plano">
      <input type="hidden" name="id">
      <label>Nome <input name="nome" required></label>
      <label>Valor mensal <input name="valor_mensal" type="number" step="0.01" required></label>
      <label>Duração (meses) <input name="duracao_meses" type="number" value="1" required></label>
      <button>Salvar</button>
    </form>
    <table><thead><tr><th>Nome</th><th>Valor</th><th>Meses</th><th></th></tr></thead><tbody id="t-planos"></tbody></table>
  </section>

  <section id="alunos">
    <form id="f-aluno">
      <input type="hidden" name="id">
      <label>Nome <input name="nome" required></label>
      <label>CPF <input name="cpf" required maxlength="14"></label>
      <label>E-mail <input name="email" type="email"></label>
      <label>Telefone <input name="telefone"></label>
      <label>Plano <select name="plano_id" id="sel-plano" required></select></label>
      <button>Salvar</button>
    </form>
    <p><label>Buscar por nome <input id="busca"></label></p>
    <table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Plano</th><th></th></tr></thead><tbody id="t-alunos"></tbody></table>
  </section>

  <section id="aulas">
    <form id="f-aula">
      <input type="hidden" name="id">
      <label>Modalidade <input name="modalidade" required></label>
      <label>Dia <input name="dia_semana" required></label>
      <label>Horário <input name="horario" type="time" required></label>
      <label>Instrutor <input name="instrutor"></label>
      <label>Vagas <input name="vagas" type="number" min="1" required></label>
      <button>Salvar</button>
    </form>
    <table><thead><tr><th>Modalidade</th><th>Dia</th><th>Horário</th><th>Vagas restantes</th><th>Inscrever aluno</th><th></th></tr></thead><tbody id="t-aulas"></tbody></table>
  </section>

    <section id="arquivos">
    <form id="f-arquivo">
      <label>Aluno <select id="arq-aluno" required></select></label>
      <label>Categoria <select id="arq-cat"><option value="foto">Foto</option><option value="atestado">Atestado</option></select></label>
      <label>Arquivo (JPG, PNG ou PDF at&eacute; 5 MB) <input id="arq-file" type="file" accept="image/jpeg,image/png,application/pdf" required></label>
      <button>Enviar</button>
    </form>
    <table><thead><tr><th>Categoria</th><th>Arquivo</th><th>Status</th><th>Bytes</th><th>Dimens&otilde;es</th></tr></thead><tbody id="arq-lista"></tbody></table>
  </section>

  <section id="relatorios">
    <h3>Ocupa&ccedil;&atilde;o das aulas</h3><div id="rel-ocupacao"></div>
    <h3>Alunos por plano</h3><div id="rel-planos"></div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
